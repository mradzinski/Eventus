org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true

# Coordinates of the published library: io.github.mradzinski:eventus:<VERSION_NAME>
GROUP=io.github.mradzinski
POM_ARTIFACT_ID=eventus
VERSION_NAME=1.0.0-rc03
POM_NAME=Eventus
POM_DESCRIPTION=Routes each UI event of a screen to its own handler, for MVVM on Kotlin Multiplatform.
POM_URL=https://github.com/mradzinski/eventus
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_SCM_URL=https://github.com/mradzinski/eventus
POM_SCM_CONNECTION=scm:git:git://github.com/mradzinski/eventus.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/mradzinski/eventus.git
POM_DEVELOPER_ID=mradzinski
POM_DEVELOPER_NAME=mradzinski
POM_DEVELOPER_URL=https://github.com/mradzinski

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The Xcode project the Kotlin Multiplatform IDE plugin links to when the project is first opened. It looks
# for an "iosApp" folder at the project root by default; ours live with the samples. The plugin links one
# project at a time and reads this line only while none is linked. To run sample-metro's iOS app from the
# IDE, choose its project under "Link Xcode Project" in the IDE's settings and delete the "iosApp" run
# configuration, so that the IDE creates a new one.
xcodeproj=./sample-koin/iosApp
