<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="t d">
  <title id="t">Sequential shared by several events</title>
  <desc id="d">A tap on plus starts a run. A tap on minus arrives while it is running and waits until the plus has ended, although it is a different event. Then it runs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131F"/><stop offset="0.55" stop-color="#0B3040"/><stop offset="1" stop-color="#0E6E6A"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#9FE8DC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="282" rx="24" fill="url(#bg)"/>
  <text x="56" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">Sequential&lt;OnQuantityClick&gt;()</text>
  <text x="1027.6" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="16" fill="#E3FBF7">OnMinusClick</text><rect x="998.5999999999999" y="31" width="18" height="18" rx="7" fill="#F6FFFD"/><text x="866.8999999999999" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="16" fill="#E3FBF7">OnPlusClick</text><circle cx="846.8999999999999" cy="40" r="9" fill="#F6FFFD"/>
  <text x="56" y="109" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">EVENTS</text>
  <text x="56" y="181" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">RUNS</text><text x="56" y="229" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC"></text>
  <path d="M180 104H1130" stroke="#9FE8DC" stroke-opacity="0.7" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="1130" y="88" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A9E9DF">time</text>
  <path d="M280 126V159" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M380 126V207" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><rect x="280" y="161" width="280" height="30" rx="15" fill="#5EEAD4"/><text x="298" y="182" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B2A3A">1</text><path d="M380 224H560" stroke="#9FE8DC" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" fill="none"/><text x="473.0" y="214" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A9E9DF">waits</text><rect x="566" y="209" width="280" height="30" rx="15" fill="#5EEAD4"/><text x="584" y="230" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B2A3A">2</text><circle cx="280" cy="104" r="20" fill="#F6FFFD"/><text x="280" y="110" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2A3A">1</text><rect x="360" y="84" width="40" height="40" rx="7" fill="#F6FFFD"/><text x="380" y="110" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2A3A">2</text>
</svg>
