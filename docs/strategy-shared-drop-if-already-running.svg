<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="234" viewBox="0 0 1200 234" role="img" aria-labelledby="t d">
  <title id="t">DropIfAlreadyRunning shared by several events</title>
  <desc id="d">A tap on Save starts a run. A tap on Delete arrives while the save is running and is ignored, although it is a different event. A tap on Delete after the save has ended starts a run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131F"/><stop offset="0.55" stop-color="#0B3040"/><stop offset="1" stop-color="#0E6E6A"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#9FE8DC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="234" rx="24" fill="url(#bg)"/>
  <text x="56" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">DropIfAlreadyRunning&lt;OnChangeClick&gt;()</text>
  <text x="1017.9" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="16" fill="#E3FBF7">OnDeleteClick</text><rect x="988.9" y="31" width="18" height="18" rx="7" fill="#F6FFFD"/><text x="857.2" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="16" fill="#E3FBF7">OnSaveClick</text><circle cx="837.2" cy="40" r="9" fill="#F6FFFD"/>
  <text x="56" y="109" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">EVENTS</text>
  <text x="56" y="181" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">RUNS</text>
  <path d="M180 104H1130" stroke="#9FE8DC" stroke-opacity="0.7" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="1130" y="88" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A9E9DF">time</text>
  <path d="M280 126V159" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M780 126V159" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><rect x="280" y="161" width="360" height="30" rx="15" fill="#5EEAD4"/><text x="298" y="182" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B2A3A">1</text><rect x="780" y="161" width="280" height="30" rx="15" fill="#5EEAD4"/><text x="798" y="182" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B2A3A">3</text><circle cx="280" cy="104" r="20" fill="#F6FFFD"/><text x="280" y="110" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2A3A">1</text><rect x="400" y="84" width="40" height="40" rx="7" fill="#0B2A3A" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 5"/><text x="420" y="110" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" fill-opacity="0.6">2</text><g stroke="#FDA4AF" stroke-width="3" stroke-linecap="round"><path d="M414 134L426 146"/><path d="M426 134L414 146"/></g><text x="436" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#FECDD3">ignored</text><rect x="760" y="84" width="40" height="40" rx="7" fill="#F6FFFD"/><text x="780" y="110" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2A3A">3</text>
</svg>
