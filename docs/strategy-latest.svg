<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
  <title id="t">Latest: the newest event replaces the one before</title>
  <desc id="d">Three events arrive one after another. The second event cancels the run of the first, and the third cancels the run of the second. Only the run of the third event reaches the end.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131F"/><stop offset="0.55" stop-color="#0B3040"/><stop offset="1" stop-color="#0E6E6A"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#9FE8DC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="230" rx="24" fill="url(#bg)"/>
  <text x="56" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">EVENTS</text>
  <text x="56" y="173" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">RUNS</text>
  <path d="M180 96H1130" stroke="#9FE8DC" stroke-opacity="0.7" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="1130" y="80" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A9E9DF">time</text>
  <text x="56" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">Latest</text>
  <path d="M280 118V151" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M420 118V151" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M560 118V151" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><rect x="280" y="153" width="134" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/><text x="298" y="174" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text><g stroke="#FDA4AF" stroke-width="3" stroke-linecap="round"><path d="M389 161L403 175"/><path d="M403 161L389 175"/></g><rect x="426" y="153" width="128" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/><text x="444" y="174" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text><g stroke="#FDA4AF" stroke-width="3" stroke-linecap="round"><path d="M529 161L543 175"/><path d="M543 161L529 175"/></g><rect x="566" y="153" width="300" height="30" rx="15" fill="#5EEAD4"/><text x="584" y="174" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B2A3A">3</text><text x="347" y="204" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#FECDD3">cancelled</text><text x="490" y="204" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#FECDD3">cancelled</text><text x="716" y="204" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A9E9DF">runs to the end</text><circle cx="280" cy="96" r="20" fill="#F6FFFD"/><text x="280" y="102" text-anchor="middle" font-family="Helvetica Neue, Helvetica