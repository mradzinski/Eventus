<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
  <title id="t">DropIfAlreadyRunning: a repeat is ignored</title>
  <desc id="d">The first event starts a run. The second event arrives while that run is still going and is ignored. The third event arrives after the run has ended and starts a new run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131F"/><stop offset="0.55" stop-color="#0B3040"/><stop offset="1" stop-color="#0E6E6A"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#9FE8DC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="230" rx="24" fill="url(#bg)"/>
  <text x="56" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">EVENTS</text>
  <text x="56" y="173" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#9FE8DC">RUNS</text>
  <path d="M180 96H1130" stroke="#9FE8DC" stroke-opacity="0.7" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <text x="1130" y="80" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#A9E9DF">time</text>
  <text x="56" y="46" font-family="Menlo, SF Mono, Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">DropIfAlreadyRunning</text>
  <path d="M280 118V151" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><path d="M760 118V151" stroke="#9FE8DC" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 6" fill="none"/><rect x="280" y="153" width="340" height="30" rx="15" fill="#5EEAD4"/><text x="298" y="174" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B2A3A">1</text><rect x="760" y="153" width="300" height="30" rx="15" fill="#5EEAD4"/><text x="778" y="174" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B2A3A">3</text><circle cx="280" cy="96" r="20" fill="#F6FFFD"/><text x="280" y="102" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2A3A">1</text><circle cx="420" cy="96" r="20" fill="#0B2A3A" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 5"/><text x="420" y="102" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" fill-opacity="0.6">2</text><circle cx="760" cy="96" r="20" fill="#F6FFFD"/><text x="760" y="102" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2A3A">3</text><g stroke="#FDA4AF" stroke-width="3" stroke-linecap="round"><path d="M414 126L426 138"/><path d="M426 126L414 138"/></g><text x="436" y="137" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#FECDD3">ignored</text>
</svg>
